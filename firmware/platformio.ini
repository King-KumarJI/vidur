; VIDUR Specs Module -- Environmental Sensor Firmware (ESP32)
;
; Implements docs/specs/serial-protocol.md exactly, for the target board
; named in this session's task: ESP32 + DHT22 (temperature/humidity,
; digital pin) + BH1750 (ambient light, I2C) + an analog sound sensor
; (ADC pin). See firmware/README.md for wiring and flashing instructions.
;
; Status: compile-verified only (`pio run`), NOT hardware-verified -- no
; physical board/sensors are available in this environment. See src/main.cpp
; and docs/tracker/development-tracker.md for the exact same disclosure.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Free, open-source libraries only, per CLAUDE.md's IoT firmware clause:
; Adafruit's DHT sensor library (DHT22), a standard open-source BH1750
; library, and native analogRead() for the sound sensor (no extra library).
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    claws/BH1750@^1.3.0
