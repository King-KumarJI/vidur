version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: vidur-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - vidur_mongo_data:/data/db

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: vidur-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - vidur_chroma_data:/chroma/chroma

volumes:
  vidur_mongo_data:
  vidur_chroma_data: