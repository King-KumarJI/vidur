; VIDUR Specs Module -- Environmental Sensor Firmware
; (ESP32 + Arduino Uno / Nano / Mega 2560, one shared codebase)
;
; Implements docs/specs/serial-protocol.md exactly (READ/IDENTIFY ->
; one JSON line), for one DHT22 (temperature/humidity, digital pin),
; one BH1750 (ambient light, I2C), and one analog sound sensor (ADC
; pin), per Constitution Article 19's requirement to support ESP32 AND
; the Arduino Uno/Nano/Mega family from a single codebase. See
; firmware/README.md for wiring (differs per board) and flashing
; instructions.
;
; Status: compile-verified only (`pio run -e <environment>`), NOT
; hardware-verified -- no physical board/sensors are available in this
; environment for any of the four targets below. See src/main.cpp and
; docs/tracker/development-tracker.md for the exact same disclosure.
;
; VIDUR_BOARD_ID (below, per environment) is the string src/main.cpp's
; IDENTIFY handshake reports -- see docs/specs/serial-protocol.md's
; "Board identification handshake" section. It is supplied here,
; explicitly, per environment rather than inferred from Arduino-core-
; internal board macros, so the PlatformIO-environment -> IDENTIFY
; mapping lives in exactly one place.

; Settings shared by every environment below (PlatformIO applies an
; [env] section's keys to all [env:*] sections that don't override
; them) -- this is what makes this "one shared codebase, not four
; copy-pasted projects."
[env]
framework = arduino
monitor_speed = 115200

; Free, open-source libraries only, per CLAUDE.md's IoT firmware clause:
; Adafruit's DHT sensor library (DHT22), a standard open-source BH1750
; library, and native analogRead() for the sound sensor (no extra
; library). All three support the AVR (Uno/Nano/Mega) targets natively,
; the same as ESP32 -- no per-board library substitution was needed.
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    claws/BH1750@^1.3.0

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -DVIDUR_BOARD_ID=\"esp32\"

[env:uno]
platform = atmelavr
board = uno
build_flags = -DVIDUR_BOARD_ID=\"uno\"

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
build_flags = -DVIDUR_BOARD_ID=\"nano\"

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
build_flags = -DVIDUR_BOARD_ID=\"mega2560\"
